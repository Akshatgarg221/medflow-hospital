{% extends 'base.html' %}{% block page_title %}Register patient{% endblock %}{% block content %}<div class="page-intro"><div><a class="back-link" href="{{ url_for('patients') }}">← Patients</a><h2>Register a patient</h2><p class="muted">Create a basic administrative record.</p></div></div><section class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="span-two">Full name *<input name="name" required maxlength="120" placeholder="Patient full name"></label><label>Age *<input name="age" type="number" min="0" max="120" required placeholder="Age"></label><label>Gender *<select name="gender" required><option value="">Select</option><option>Female</option><option>Male</option><option>Non-binary</option><option>Prefer not to say</option></select></label><label>Phone<input name="phone" type="tel" maxlength="30" placeholder="Contact number"></label><label>Department *<select name="department" required><option value="">Select department</option>{% for d in ['General Medicine','Cardiology','Orthopedics','Neurology','Pediatrics','Oncology','Emergency','Other'] %}<option>{{ d }}</option>{% endfor %}</select></label><label>Status *<select name="status"><option>Outpatient</option><option>Admitted</option><option>Under observation</option><option>Discharged</option></select></label><div class="span-two form-actions"><p class="muted">Only collect information needed for administrative care workflows.</p><a class="btn secondary" href="{{ url_for('patients') }}">Cancel</a><button class="btn primary">Create record →</button></div></form></section>{% endblock %}
